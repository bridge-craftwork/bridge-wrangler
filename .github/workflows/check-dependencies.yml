name: Check Dependencies

on:
  schedule:
    # 12:00 UTC daily. GitHub cron has no DST handling, so this is 4 AM PST
    # and 5 AM PDT.
    - cron: '0 12 * * *'
  workflow_dispatch:  # Allow manual trigger

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    permissions:
      contents: write
      actions: write
    name: Check for dependency updates
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-git-

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-build-target-

    - name: Check for internal dependency updates
      id: check
      run: |
        # Only re-resolve the internal bridge-craftwork crates. They are
        # unpinned git dependencies, so nothing else would ever pull an upstream
        # fix into a released binary. A blanket `cargo update` would also churn
        # every crates.io transitive dep and cut a release for any unrelated
        # bump anywhere in the tree.
        update_args=()
        while read -r pkg; do
          update_args+=(-p "$pkg")
        done < <(awk '
          /^name = / { name = $3; gsub(/"/, "", name) }
          /^source = .*github\.com\/bridge-craftwork\// { print name }
        ' Cargo.lock | sort -u)

        if [ ${#update_args[@]} -eq 0 ]; then
          echo "::error::No bridge-craftwork git dependencies found in Cargo.lock"
          exit 1
        fi

        echo "Tracking:${update_args[*]/#-p/}"

        old_hash=$(sha256sum Cargo.lock | cut -d' ' -f1)
        cargo update "${update_args[@]}"
        new_hash=$(sha256sum Cargo.lock | cut -d' ' -f1)

        if [ "$old_hash" != "$new_hash" ]; then
          echo "updated=true" >> $GITHUB_OUTPUT
          echo "Internal dependencies have been updated"
          git --no-pager diff --stat Cargo.lock
        else
          echo "updated=false" >> $GITHUB_OUTPUT
          echo "No internal dependency updates found"
        fi

    # Bump before building so the build syncs Cargo.lock's own bridge-wrangler
    # entry to the new version - otherwise the lock ships one version behind the
    # tag it is committed under.
    - name: Bump patch version
      id: bump
      if: steps.check.outputs.updated == 'true'
      run: |
        current=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
        major=$(echo $current | cut -d. -f1)
        minor=$(echo $current | cut -d. -f2)
        patch=$(echo $current | cut -d. -f3)
        new_version="$major.$minor.$((patch + 1))"

        echo "Bumping version from $current to $new_version"
        sed -i "s/^version = \"$current\"/version = \"$new_version\"/" Cargo.toml
        echo "version=$new_version" >> $GITHUB_OUTPUT

    - name: Build
      if: steps.check.outputs.updated == 'true'
      run: cargo build --release

    - name: Run tests
      if: steps.check.outputs.updated == 'true'
      run: cargo test

    - name: Commit, tag and release
      if: steps.check.outputs.updated == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NEW_VERSION: ${{ steps.bump.outputs.version }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Commit and tag - release.yml will handle creating the GitHub release with binaries
        git add Cargo.toml Cargo.lock
        git commit -m "Release v$NEW_VERSION (dependency update)"
        git tag "v$NEW_VERSION"
        git push && git push --tags

        # Tag pushes from GITHUB_TOKEN do not trigger downstream workflows, so
        # explicitly dispatch the release build against the new tag ref.
        gh workflow run release.yml --ref "v$NEW_VERSION"
